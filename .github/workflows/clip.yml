name: Six Star Clipper

# Start: Actions → "Six Star Clipper" → Run workflow, oder per gh:
# gh workflow run clip.yml -f jobs='[{"name":"dylan-001","url":"https://www.youtube.com/watch?v=...","start":"03:12:40","end":"03:13:15","hook":"Dylan finds the *SECRET* spot","credit":"@dylan.page."}]'

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'JSON-Liste der Clips: name, url, start, end, [layout split|full|blur], [corner tl|tr|bl|br], [fc_size], [hook], [credit], [disc], [subs true|false]. Neu-Render: nur Namen, z. B. ["kai-001-skunkape"] oder mit Änderung {"name":"kai-001-skunkape","hook":"..."}'
        required: true

permissions:
  contents: write

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.r.outputs.jobs }}
    steps:
      - name: Rezepte auflösen (gespeicherte Clips per Name neu rendern)
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: ${{ inputs.jobs }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          out = []
          for j in json.loads(os.environ["JOBS"]):
              if isinstance(j, str):
                  j = {"name": j}
              if "url" not in j:
                  subprocess.run(["gh", "release", "download", "clips", "-R", os.environ["REPO"],
                                  "-p", j["name"] + ".job.json", "--clobber"], check=True)
                  base = json.load(open(j["name"] + ".job.json"))
                  base.update(j)
                  j = base
              out.append(j)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("jobs=" + json.dumps(out) + "\n")
          print(json.dumps(out, indent=1))
          PY

  clip:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Werkzeuge installieren (kostenlos)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          mkdir -p ~/.fonts && curl -sL -o ~/.fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf && fc-cache -f
          pip install -q -U yt-dlp faster-whisper opencv-python-headless

      - name: Ausschnitt herunterladen
        env:
          URL: ${{ matrix.job.url }}
          START: ${{ matrix.job.start }}
          END: ${{ matrix.job.end }}
        run: |
          # 3 s Vorlauf laden, dann exakt schneiden: Twitch/Kick-Segmente liefern sonst am Anfang oft keinen Ton
          S0=$(python3 -c "import sys;p=[float(x) for x in sys.argv[1].split(':')];s=sum(v*60**i for i,v in enumerate(reversed(p)));print(max(0,s-3))" "$START")
          PRE=$(python3 -c "import sys;p=[float(x) for x in sys.argv[1].split(':')];s=sum(v*60**i for i,v in enumerate(reversed(p)));print(min(3,s))" "$START")
          yt-dlp --no-playlist --download-sections "*${S0}-${END}" --force-keyframes-at-cuts \
            -f "bv*[height<=1080]+ba/b[height<=1080]/b" --merge-output-format mp4 -o raw.mp4 "$URL"
          # stumme Lücke am Anfang (fehlende Audiopakete) überspringen
          LEAD=$(ffmpeg -v info -t 8 -i raw.mp4 -vn -af silencedetect=n=-70dB:d=0.3 -f null - 2>&1 | python3 -c "import sys,re;t=sys.stdin.read();m=re.search(r'silence_start: (-?[0-9.]+)[^\n]*\n.*?silence_end: ([0-9.]+)',t,re.S);print(m.group(2) if m and float(m.group(1))<=0.05 else 0)")
          CUT=$(python3 -c "import sys;print(max(float(sys.argv[1]),float(sys.argv[2])))" "$PRE" "$LEAD")
          echo "Vorlauf $PRE s, stumme Lücke $LEAD s, Schnitt bei $CUT s"
          ffmpeg -y -v error -ss "$CUT" -i raw.mp4 -map 0:v:0 -map 0:a:0? -c:v libx264 -preset veryfast -crf 18 \
            -af "aresample=async=1:first_pts=0" -c:a aac -b:a 192k src.mp4
          ffprobe -v error -show_entries stream=codec_type,start_time,duration -of compact src.mp4
          ls -lh src.mp4

      - name: Untertitel erzeugen
        if: ${{ format('{0}', matrix.job.subs) != 'false' }}
        run: python scripts/transcribe.py src.mp4 words.json en

      - name: Clip rendern (9:16)
        env:
          NAME: ${{ matrix.job.name }}
          LAYOUT: ${{ matrix.job.layout || 'auto' }}
          CORNER: ${{ matrix.job.corner || 'tr' }}
          FCSIZE: ${{ matrix.job.fc_size || '0.26' }}
          HOOK: ${{ matrix.job.hook }}
          CREDIT: ${{ matrix.job.credit }}
          DISC: ${{ matrix.job.disc || '#ad' }}
        run: |
          WORDS=""; [ -f words.json ] && WORDS="--words words.json"
          python scripts/render.py --input src.mp4 --out "$NAME.mp4" --layout "$LAYOUT" \
            --fc-corner "$CORNER" --fc-size "$FCSIZE" --hook "$HOOK" --credit "$CREDIT" --disc "$DISC" $WORDS

      - name: Qualitäts-Tor (Ton, Format, Länge, Media-Share)
        env:
          NAME: ${{ matrix.job.name }}
        run: |
          W=""; [ -f words.json ] && W="words.json"
          python scripts/qa.py "$NAME.mp4" "$W" qa.json | tee -a $GITHUB_STEP_SUMMARY

      - name: Als öffentliche Datei bereitstellen (Release "clips")
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.job.name }}
          JOB: ${{ toJSON(matrix.job) }}
        run: |
          gh release view clips >/dev/null 2>&1 || gh release create clips --title "Clips" --notes "Automatisch erzeugte Clips"
          printf '%s' "$JOB" > "$NAME.job.json"
          gh release upload clips "$NAME.mp4" "$NAME.job.json" --clobber
          echo "### Fertig: https://github.com/${{ github.repository }}/releases/download/clips/$NAME.mp4" >> $GITHUB_STEP_SUMMARY
